<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NetFlow Customer Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<style>
  :root {
    --bg: #0a0e1a;
    --bg2: #111827;
    --bg3: #1a2235;
    --card: #141c2e;
    --card2: #1e2a40;
    --border: #2a3a55;
    --accent: #3b82f6;
    --accent2: #60a5fa;
    --accent-glow: rgba(59,130,246,0.18);
    --green: #22c55e;
    --green-dim: rgba(34,197,94,0.12);
    --red: #ef4444;
    --red-dim: rgba(239,68,68,0.12);
    --yellow: #f59e0b;
    --yellow-dim: rgba(245,158,11,0.12);
    --text: #f0f4ff;
    --text2: #94a3b8;
    --text3: #64748b;
    --radius: 16px;
    --radius-sm: 10px;
    --shadow: 0 8px 32px rgba(0,0,0,0.4);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── Noise overlay ── */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none; z-index: 0; opacity: 0.4;
  }

  /* ════════════════════════════════════
     LOGIN SCREEN
  ════════════════════════════════════ */
  #login-screen {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 24px;
    background: radial-gradient(ellipse at 60% 20%, rgba(59,130,246,0.12) 0%, transparent 60%),
                radial-gradient(ellipse at 10% 80%, rgba(96,165,250,0.07) 0%, transparent 50%),
                var(--bg);
    position: relative; z-index: 1;
  }

  .login-box {
    width: 100%; max-width: 420px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 48px 40px;
    box-shadow: var(--shadow), 0 0 80px rgba(59,130,246,0.08);
    animation: slideUp 0.5s cubic-bezier(0.16,1,0.3,1);
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .login-logo {
    display: flex; align-items: center; gap: 12px; margin-bottom: 32px;
  }
  .login-logo-icon {
    width: 44px; height: 44px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
  }
  .login-logo-text {
    font-family: 'Syne', sans-serif;
    font-size: 22px; font-weight: 800;
    letter-spacing: -0.5px;
  }
  .login-logo-text span { color: var(--accent2); }

  .login-title {
    font-family: 'Syne', sans-serif;
    font-size: 26px; font-weight: 700;
    margin-bottom: 6px;
  }
  .login-sub { color: var(--text2); font-size: 14px; margin-bottom: 32px; }

  .form-group { margin-bottom: 18px; }
  .form-label { display: block; font-size: 12px; font-weight: 500; color: var(--text2); margin-bottom: 8px; letter-spacing: 0.5px; text-transform: uppercase; }

  .form-input {
    width: 100%; padding: 14px 16px;
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: var(--radius-sm); color: var(--text);
    font-family: 'DM Sans', sans-serif; font-size: 15px;
    transition: border-color 0.2s, box-shadow 0.2s;
    outline: none;
  }
  .form-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }
  .form-input::placeholder { color: var(--text3); }

  .btn-primary {
    width: 100%; padding: 15px;
    background: linear-gradient(135deg, var(--accent), #2563eb);
    border: none; border-radius: var(--radius-sm);
    color: white; font-family: 'Syne', sans-serif;
    font-size: 15px; font-weight: 700; letter-spacing: 0.3px;
    cursor: pointer; transition: all 0.2s;
    box-shadow: 0 4px 20px rgba(59,130,246,0.35);
    margin-top: 8px;
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 28px rgba(59,130,246,0.45); }
  .btn-primary:active { transform: translateY(0); }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

  .error-msg {
    background: var(--red-dim); border: 1px solid rgba(239,68,68,0.3);
    border-radius: var(--radius-sm); padding: 12px 14px;
    color: #fca5a5; font-size: 13px; margin-top: 14px;
    display: none;
  }

  /* ════════════════════════════════════
     APP SHELL
  ════════════════════════════════════ */
  #app { display: none; min-height: 100vh; position: relative; z-index: 1; }

  /* ── Top Nav ── */
  .topnav {
    position: sticky; top: 0; z-index: 100;
    background: rgba(10,14,26,0.9); backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    padding: 0 24px; height: 60px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .nav-brand {
    font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 800;
    display: flex; align-items: center; gap: 8px;
  }
  .nav-brand-dot { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.6;transform:scale(1.3)} }

  .nav-right { display: flex; align-items: center; gap: 12px; }
  .nav-username { font-size: 13px; color: var(--text2); }
  .btn-logout {
    padding: 7px 14px; background: transparent;
    border: 1px solid var(--border); border-radius: 8px;
    color: var(--text2); font-size: 12px; cursor: pointer;
    font-family: 'DM Sans', sans-serif; transition: all 0.2s;
  }
  .btn-logout:hover { border-color: var(--red); color: var(--red); }

  /* ── Bottom Tab Bar ── */
  .tab-bar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
    background: rgba(17,24,39,0.96); backdrop-filter: blur(16px);
    border-top: 1px solid var(--border);
    display: flex; height: 64px;
  }
  .tab-item {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 3px; cursor: pointer; transition: all 0.2s;
    color: var(--text3); font-size: 10px; font-weight: 500;
    position: relative;
  }
  .tab-item.active { color: var(--accent2); }
  .tab-item .tab-icon { font-size: 20px; line-height: 1; }
  .tab-item.active::before {
    content: '';
    position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    width: 32px; height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 0 0 4px 4px;
  }
  .notif-badge {
    position: absolute; top: 8px; right: calc(50% - 14px);
    width: 16px; height: 16px; background: var(--red);
    border-radius: 50%; font-size: 9px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    color: white;
  }

  /* ── Page Content ── */
  .page-content {
    padding: 20px 20px 84px;
    max-width: 600px; margin: 0 auto;
  }

  /* ── Pages ── */
  .page { display: none; animation: fadeIn 0.3s ease; }
  .page.active { display: block; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

  /* ════════════════════════════════════
     DASHBOARD
  ════════════════════════════════════ */
  .hero-card {
    background: linear-gradient(135deg, #1a2a4a 0%, #0f1e38 50%, #0a1628 100%);
    border: 1px solid rgba(59,130,246,0.25);
    border-radius: 20px; padding: 24px;
    margin-bottom: 16px; position: relative; overflow: hidden;
  }
  .hero-card::before {
    content: '';
    position: absolute; top: -40px; right: -40px;
    width: 160px; height: 160px;
    background: radial-gradient(circle, rgba(59,130,246,0.2) 0%, transparent 70%);
    border-radius: 50%;
  }
  .hero-card::after {
    content: '';
    position: absolute; bottom: -30px; left: 30px;
    width: 100px; height: 100px;
    background: radial-gradient(circle, rgba(96,165,250,0.1) 0%, transparent 70%);
    border-radius: 50%;
  }
  .hero-name { font-family: 'Syne', sans-serif; font-size: 22px; font-weight: 700; margin-bottom: 4px; }
  .hero-phone { color: var(--text2); font-size: 13px; margin-bottom: 20px; }

  .status-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 600;
    margin-bottom: 20px;
  }
  .status-badge.active { background: var(--green-dim); color: var(--green); border: 1px solid rgba(34,197,94,0.25); }
  .status-badge.expired { background: var(--red-dim); color: var(--red); border: 1px solid rgba(239,68,68,0.25); }
  .status-badge-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  .hero-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; position: relative; z-index: 1; }
  .hero-stat { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); border-radius: 12px; padding: 14px; }
  .hero-stat-label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
  .hero-stat-value { font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 700; color: var(--text); word-break: break-word; }
  .hero-stat-value.expiring { color: var(--yellow); }
  .hero-stat-value.expired-val { color: var(--red); }

  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  .info-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px; transition: border-color 0.2s;
  }
  .info-card:hover { border-color: var(--accent); }
  .info-icon { font-size: 22px; margin-bottom: 8px; }
  .info-label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
  .info-value { font-size: 14px; font-weight: 500; color: var(--text); }

  .balance-card {
    background: var(--yellow-dim); border: 1px solid rgba(245,158,11,0.25);
    border-radius: var(--radius); padding: 16px;
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px;
  }
  .balance-label { font-size: 13px; color: var(--yellow); font-weight: 500; }
  .balance-value { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 800; color: var(--yellow); }

  .quick-recharge-btn {
    width: 100%; padding: 16px;
    background: linear-gradient(135deg, var(--accent), #2563eb);
    border: none; border-radius: var(--radius-sm);
    color: white; font-family: 'Syne', sans-serif;
    font-size: 15px; font-weight: 700; cursor: pointer;
    transition: all 0.2s; box-shadow: 0 4px 20px rgba(59,130,246,0.35);
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .quick-recharge-btn:hover { box-shadow: 0 8px 28px rgba(59,130,246,0.5); transform: translateY(-1px); }

  /* ════════════════════════════════════
     PLANS / RECHARGE
  ════════════════════════════════════ */
  .section-title {
    font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 700;
    margin-bottom: 16px; display: flex; align-items: center; gap: 8px;
  }
  .section-title span { color: var(--accent2); }

  .plans-grid { display: grid; gap: 12px; }

  .plan-card {
    background: var(--card); border: 1.5px solid var(--border);
    border-radius: var(--radius); padding: 20px;
    cursor: pointer; transition: all 0.2s; position: relative; overflow: hidden;
  }
  .plan-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 8px 32px rgba(59,130,246,0.15); }
  .plan-card.selected { border-color: var(--accent); background: linear-gradient(135deg, rgba(59,130,246,0.08), var(--card)); }
  .plan-card.popular::before {
    content: 'POPULAR';
    position: absolute; top: 12px; right: -24px;
    background: var(--accent); color: white; font-size: 9px; font-weight: 700;
    padding: 3px 32px; transform: rotate(45deg);
    letter-spacing: 1px;
  }

  .plan-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
  .plan-name { font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 700; }
  .plan-price { font-family: 'Syne', sans-serif; font-size: 24px; font-weight: 800; color: var(--accent2); }
  .plan-price-sub { font-size: 12px; color: var(--text3); font-family: 'DM Sans', sans-serif; font-weight: 400; }

  .plan-details { display: flex; gap: 16px; flex-wrap: wrap; }
  .plan-detail { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text2); }
  .plan-detail-icon { font-size: 15px; }

  .recharge-type-selector {
    display: flex; gap: 10px; margin-bottom: 20px;
  }
  .type-btn {
    flex: 1; padding: 10px;
    background: var(--card2); border: 1.5px solid var(--border);
    border-radius: var(--radius-sm); color: var(--text2);
    font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500;
    cursor: pointer; transition: all 0.2s; text-align: center;
  }
  .type-btn.active { border-color: var(--accent); color: var(--accent2); background: var(--accent-glow); }

  .pay-btn {
    width: 100%; padding: 16px;
    background: linear-gradient(135deg, var(--green), #16a34a);
    border: none; border-radius: var(--radius-sm);
    color: white; font-family: 'Syne', sans-serif;
    font-size: 16px; font-weight: 700; cursor: pointer;
    transition: all 0.2s; box-shadow: 0 4px 20px rgba(34,197,94,0.3);
    margin-top: 20px; display: none;
  }
  .pay-btn:hover { box-shadow: 0 8px 28px rgba(34,197,94,0.45); transform: translateY(-1px); }
  .pay-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

  /* ════════════════════════════════════
     HISTORY
  ════════════════════════════════════ */
  .history-list { display: grid; gap: 10px; }

  .history-item {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px;
    display: grid; grid-template-columns: 1fr auto;
    gap: 8px; align-items: start;
  }
  .history-plan { font-weight: 600; font-size: 15px; margin-bottom: 4px; }
  .history-meta { font-size: 12px; color: var(--text2); }
  .history-amount { font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 700; color: var(--green); text-align: right; }
  .history-date { font-size: 11px; color: var(--text3); text-align: right; margin-top: 2px; }
  .history-txn { font-size: 10px; color: var(--text3); margin-top: 4px; font-family: monospace; }

  /* ════════════════════════════════════
     NOTIFICATIONS
  ════════════════════════════════════ */
  .notif-list { display: grid; gap: 10px; }

  .notif-item {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px;
    transition: border-color 0.2s;
  }
  .notif-item.unread { border-color: rgba(59,130,246,0.35); background: linear-gradient(135deg, rgba(59,130,246,0.05), var(--card)); }
  .notif-msg { font-size: 14px; line-height: 1.5; margin-bottom: 8px; }
  .notif-time { font-size: 11px; color: var(--text3); }
  .notif-dot { display: inline-block; width: 7px; height: 7px; background: var(--accent); border-radius: 50%; margin-right: 6px; }

  /* ════════════════════════════════════
     WIFI CHANGE
  ════════════════════════════════════ */
  .wifi-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 24px; margin-bottom: 16px;
  }
  .wifi-current { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .wifi-icon-big { font-size: 36px; }
  .wifi-current-label { font-size: 12px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.5px; }
  .wifi-current-ssid { font-family: 'Syne', sans-serif; font-size: 17px; font-weight: 700; }

  .wifi-form .form-group { margin-bottom: 16px; }

  .btn-wifi {
    width: 100%; padding: 15px;
    background: linear-gradient(135deg, #7c3aed, #6d28d9);
    border: none; border-radius: var(--radius-sm);
    color: white; font-family: 'Syne', sans-serif;
    font-size: 15px; font-weight: 700; cursor: pointer;
    transition: all 0.2s; box-shadow: 0 4px 20px rgba(124,58,237,0.35);
  }
  .btn-wifi:hover { box-shadow: 0 8px 28px rgba(124,58,237,0.5); transform: translateY(-1px); }
  .btn-wifi:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

  /* ════════════════════════════════════
     SHARED UI
  ════════════════════════════════════ */
  .empty-state {
    text-align: center; padding: 48px 24px; color: var(--text3);
  }
  .empty-icon { font-size: 48px; margin-bottom: 12px; }
  .empty-text { font-size: 15px; }

  .loading-spinner {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 48px; gap: 16px; color: var(--text3);
  }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toast {
    position: fixed; bottom: 76px; left: 50%; transform: translateX(-50%);
    background: var(--card2); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 20px;
    font-size: 14px; font-weight: 500; z-index: 999;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    animation: toastIn 0.3s cubic-bezier(0.16,1,0.3,1);
    white-space: nowrap;
  }
  .toast.success { border-color: rgba(34,197,94,0.4); color: var(--green); }
  .toast.error   { border-color: rgba(239,68,68,0.4); color: #fca5a5; }
  .toast.info    { border-color: rgba(59,130,246,0.4); color: var(--accent2); }
  @keyframes toastIn { from{opacity:0;transform:translateX(-50%) translateY(12px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }

  .divider {
    border: none; border-top: 1px solid var(--border);
    margin: 20px 0;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>

<!-- ══════════════════════════════════════
     LOGIN SCREEN
══════════════════════════════════════ -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">
      <div class="login-logo-icon">📡</div>
      <div class="login-logo-text">Net<span>Flow</span></div>
    </div>
    <div class="login-title">Welcome back</div>
    <div class="login-sub">Sign in to your customer portal</div>

    <div class="form-group">
      <label class="form-label">Mobile Number</label>
      <input type="tel" id="login-phone" class="form-input" placeholder="Enter your mobile number" maxlength="10">
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input type="password" id="login-password" class="form-input" placeholder="Enter your password">
    </div>
    <button class="btn-primary" id="login-btn" onclick="doLogin()">Sign In</button>
    <div class="error-msg" id="login-error"></div>
  </div>
</div>

<!-- ══════════════════════════════════════
     APP
══════════════════════════════════════ -->
<div id="app">
  <!-- Top Nav -->
  <nav class="topnav">
    <div class="nav-brand">
      <div class="nav-brand-dot"></div>
      NetFlow
    </div>
    <div class="nav-right">
      <span class="nav-username" id="nav-username"></span>
      <button class="btn-logout" onclick="logout()">Logout</button>
    </div>
  </nav>

  <!-- Pages -->
  <div class="page-content">

    <!-- ── Dashboard ── -->
    <div class="page active" id="page-home">
      <div id="dashboard-loading" class="loading-spinner"><div class="spinner"></div><span>Loading your profile…</span></div>
      <div id="dashboard-content" style="display:none"></div>
    </div>

    <!-- ── Recharge ── -->
    <div class="page" id="page-recharge">
      <div class="section-title">📶 Recharge <span>Plans</span></div>

      <div class="recharge-type-selector">
        <div class="type-btn active" id="type-renewal" onclick="setRechargeType('renewal')">🔄 Renewal</div>
        <div class="type-btn" id="type-advance" onclick="setRechargeType('advance')">⏩ Advance</div>
      </div>

      <div id="plans-loading" class="loading-spinner"><div class="spinner"></div><span>Fetching plans…</span></div>
      <div id="plans-list" class="plans-grid"></div>

      <button class="pay-btn" id="pay-btn" onclick="initiatePayment()">
        💳 Pay ₹<span id="pay-amount">0</span>
      </button>
    </div>

    <!-- ── History ── -->
    <div class="page" id="page-history">
      <div class="section-title">🧾 Recharge <span>History</span></div>
      <div id="history-loading" class="loading-spinner"><div class="spinner"></div><span>Loading history…</span></div>
      <div id="history-list" class="history-list"></div>
    </div>

    <!-- ── Notifications ── -->
    <div class="page" id="page-notif">
      <div class="section-title">🔔 <span>Notifications</span></div>
      <div id="notif-loading" class="loading-spinner"><div class="spinner"></div><span>Loading notifications…</span></div>
      <div id="notif-list" class="notif-list"></div>
    </div>

    <!-- ── WiFi ── -->
    <div class="page" id="page-wifi">
      <div class="section-title">📡 WiFi <span>Settings</span></div>
      <div id="wifi-content"></div>
    </div>

  </div>

  <!-- Tab Bar -->
  <div class="tab-bar">
    <div class="tab-item active" id="tab-home" onclick="switchTab('home')">
      <div class="tab-icon">🏠</div>
      <div>Home</div>
    </div>
    <div class="tab-item" id="tab-recharge" onclick="switchTab('recharge')">
      <div class="tab-icon">⚡</div>
      <div>Recharge</div>
    </div>
    <div class="tab-item" id="tab-history" onclick="switchTab('history')">
      <div class="tab-icon">📋</div>
      <div>History</div>
    </div>
    <div class="tab-item" id="tab-notif" onclick="switchTab('notif')">
      <div class="tab-icon">🔔</div>
      <div>Alerts</div>
      <div class="notif-badge" id="notif-badge" style="display:none">0</div>
    </div>
    <div class="tab-item" id="tab-wifi" onclick="switchTab('wifi')">
      <div class="tab-icon">📡</div>
      <div>WiFi</div>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════════
//  CONFIG
// ══════════════════════════════════════
const BASE = 'https://isp-billing-api.netflowcloud.workers.dev';

// ══════════════════════════════════════
//  STATE
// ══════════════════════════════════════
let token = localStorage.getItem('nf_token') || null;
let profile = null;
let plans = [];
let selectedPlanId = null;
let rechargeType = 'renewal';

// ══════════════════════════════════════
//  INIT
// ══════════════════════════════════════
window.onload = () => {
  if (token) showApp();
  // Enter key on login
  document.getElementById('login-password').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });
  document.getElementById('login-phone').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('login-password').focus();
  });
};

// ══════════════════════════════════════
//  API HELPER
// ══════════════════════════════════════
async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json' };
  if (token) headers['Authorization'] = `Bearer ${token}`;
  const res = await fetch(BASE + path, { ...opts, headers });
  return res.json();
}

// ══════════════════════════════════════
//  LOGIN
// ══════════════════════════════════════
async function doLogin() {
  const phone    = document.getElementById('login-phone').value.trim();
  const password = document.getElementById('login-password').value;
  const errEl    = document.getElementById('login-error');
  const btn      = document.getElementById('login-btn');

  errEl.style.display = 'none';
  if (!phone || !password) { showLoginError('Please enter your mobile number and password.'); return; }

  btn.disabled = true; btn.textContent = 'Signing in…';

  try {
    const data = await api('/api/auth/customer/login', {
      method: 'POST',
      body: JSON.stringify({ phone, password })
    });

    if (!data.success) { showLoginError(data.message || data.error || 'Login failed. Check your credentials.'); }
    else {
      // Handle single or multiple accounts
      const d = data.data;
      const t = d.token || (d.accounts && d.accounts[0]?.token);
      if (!t) { showLoginError('No token received. Please try again.'); return; }
      token = t;
      localStorage.setItem('nf_token', token);
      showApp();
    }
  } catch (e) { showLoginError('Network error. Please check your connection.'); }
  finally { btn.disabled = false; btn.textContent = 'Sign In'; }
}

function showLoginError(msg) {
  const el = document.getElementById('login-error');
  el.textContent = msg; el.style.display = 'block';
}

// ══════════════════════════════════════
//  APP INIT
// ══════════════════════════════════════
function showApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  loadDashboard();
}

function logout() {
  token = null;
  localStorage.removeItem('nf_token');
  profile = null; plans = []; selectedPlanId = null;
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('login-phone').value = '';
  document.getElementById('login-password').value = '';
  document.getElementById('login-error').style.display = 'none';
  switchTab('home');
}

// ══════════════════════════════════════
//  TAB NAV
// ══════════════════════════════════════
function switchTab(tab) {
  document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  document.getElementById('page-' + tab).classList.add('active');

  if (tab === 'recharge' && plans.length === 0) loadPlans();
  if (tab === 'history')  loadHistory();
  if (tab === 'notif')    loadNotifications();
  if (tab === 'wifi')     renderWifi();
}

// ══════════════════════════════════════
//  DASHBOARD
// ══════════════════════════════════════
async function loadDashboard() {
  try {
    const data = await api('/api/customer/profile');
    if (!data.success) { if (data.error === 'Unauthorized') { logout(); return; } }
    profile = data.data;
    document.getElementById('nav-username').textContent = profile.name?.split(' ')[0] || '';
    renderDashboard();
    checkUnread();
  } catch (e) {
    document.getElementById('dashboard-loading').innerHTML = '<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-text">Failed to load profile. Please refresh.</div></div>';
  }
}

function renderDashboard() {
  const p = profile;
  const loading = document.getElementById('dashboard-loading');
  const content = document.getElementById('dashboard-content');
  loading.style.display = 'none';
  content.style.display = 'block';

  const today = new Date();
  const expiry = p.expiry_date ? new Date(p.expiry_date) : null;
  const daysLeft = expiry ? Math.ceil((expiry - today) / 86400000) : null;
  const isActive = p.status === 'active';

  let expiryClass = '';
  if (daysLeft !== null) {
    if (daysLeft < 0)  expiryClass = 'expired-val';
    else if (daysLeft <= 7) expiryClass = 'expiring';
  }

  const statusCls = isActive ? 'active' : 'expired';
  const statusLabel = isActive ? '● Active' : '● Expired';

  content.innerHTML = `
    <div class="hero-card">
      <div class="hero-name">${esc(p.name)}</div>
      <div class="hero-phone">📱 ${esc(p.phone)}</div>
      <div class="status-badge ${statusCls}">
        <div class="status-badge-dot"></div>
        ${statusLabel}
      </div>
      <div class="hero-stats">
        <div class="hero-stat">
          <div class="hero-stat-label">Plan</div>
          <div class="hero-stat-value">${esc(p.plan_name || 'N/A')}</div>
        </div>
        <div class="hero-stat">
          <div class="hero-stat-label">Speed</div>
          <div class="hero-stat-value">${esc(p.plan_speed || 'N/A')}</div>
        </div>
        <div class="hero-stat">
          <div class="hero-stat-label">Expires</div>
          <div class="hero-stat-value ${expiryClass}">${p.expiry_date ? fmtDate(p.expiry_date) : 'N/A'}</div>
        </div>
        <div class="hero-stat">
          <div class="hero-stat-label">Days Left</div>
          <div class="hero-stat-value ${expiryClass}">${daysLeft !== null ? (daysLeft < 0 ? 'Expired' : daysLeft + ' days') : 'N/A'}</div>
        </div>
      </div>
    </div>

    ${(p.balance_due && p.balance_due > 0) ? `
    <div class="balance-card">
      <div>
        <div class="balance-label">⚠️ Balance Due</div>
        <div style="font-size:12px;color:var(--text2);margin-top:2px">Will be added to next recharge</div>
      </div>
      <div class="balance-value">₹${p.balance_due}</div>
    </div>` : ''}

    <div class="info-grid">
      ${p.plan_price ? `<div class="info-card"><div class="info-icon">💰</div><div class="info-label">Plan Price</div><div class="info-value">₹${p.plan_price}</div></div>` : ''}
      ${p.wifi_ssid ? `<div class="info-card"><div class="info-icon">📶</div><div class="info-label">WiFi Name</div><div class="info-value">${esc(p.wifi_ssid)}</div></div>` : ''}
      ${p.email ? `<div class="info-card"><div class="info-icon">📧</div><div class="info-label">Email</div><div class="info-value" style="font-size:12px">${esc(p.email)}</div></div>` : ''}
      ${p.address ? `<div class="info-card"><div class="info-icon">📍</div><div class="info-label">Address</div><div class="info-value" style="font-size:12px">${esc(p.address)}</div></div>` : ''}
      ${p.router_brand ? `<div class="info-card"><div class="info-icon">📦</div><div class="info-label">Router</div><div class="info-value">${esc(p.router_brand)}</div></div>` : ''}
      ${p.mac_address ? `<div class="info-card"><div class="info-icon">🔗</div><div class="info-label">MAC Address</div><div class="info-value" style="font-size:12px">${esc(p.mac_address)}</div></div>` : ''}
    </div>

    <button class="quick-recharge-btn" onclick="switchTab('recharge')">
      ⚡ Recharge Now
    </button>
  `;
}

// ══════════════════════════════════════
//  PLANS
// ══════════════════════════════════════
async function loadPlans() {
  const listEl = document.getElementById('plans-list');
  document.getElementById('plans-loading').style.display = 'flex';
  listEl.innerHTML = '';

  try {
    const data = await api('/api/customer/plans');
    document.getElementById('plans-loading').style.display = 'none';

    if (!data.success || !data.data?.length) {
      listEl.innerHTML = '<div class="empty-state"><div class="empty-icon">📋</div><div class="empty-text">No plans available</div></div>';
      return;
    }
    plans = data.data;
    renderPlans();
  } catch (e) {
    document.getElementById('plans-loading').style.display = 'none';
    listEl.innerHTML = '<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-text">Failed to load plans</div></div>';
  }
}

function renderPlans() {
  const listEl = document.getElementById('plans-list');
  if (!plans.length) return;

  const midIdx = Math.floor(plans.length / 2);
  listEl.innerHTML = plans.map((plan, i) => `
    <div class="plan-card ${i === midIdx ? 'popular' : ''} ${selectedPlanId === plan.id ? 'selected' : ''}"
         id="plan-${plan.id}" onclick="selectPlan(${plan.id}, ${plan.price})">
      <div class="plan-header">
        <div class="plan-name">${esc(plan.name)}</div>
        <div>
          <div class="plan-price">₹${plan.price}</div>
          <div class="plan-price-sub">${plan.validity_days} days</div>
        </div>
      </div>
      <div class="plan-details">
        ${plan.speed_down_mbps ? `<div class="plan-detail"><span class="plan-detail-icon">⬇️</span>${plan.speed_down_mbps} Mbps</div>` : ''}
        ${plan.speed_up_mbps ? `<div class="plan-detail"><span class="plan-detail-icon">⬆️</span>${plan.speed_up_mbps} Mbps</div>` : ''}
        <div class="plan-detail"><span class="plan-detail-icon">📅</span>${plan.validity_days} Days</div>
      </div>
    </div>
  `).join('');
}

function selectPlan(id, price) {
  selectedPlanId = id;
  // Update card styles
  document.querySelectorAll('.plan-card').forEach(c => c.classList.remove('selected'));
  document.getElementById('plan-' + id)?.classList.add('selected');

  // Calc total with balance
  const due = profile?.balance_due || 0;
  const total = price + due;
  document.getElementById('pay-amount').textContent = total;
  document.getElementById('pay-btn').style.display = 'block';
}

function setRechargeType(type) {
  rechargeType = type;
  document.getElementById('type-renewal').classList.toggle('active', type === 'renewal');
  document.getElementById('type-advance').classList.toggle('active', type === 'advance');
}

// ══════════════════════════════════════
//  PAYMENT
// ══════════════════════════════════════
async function initiatePayment() {
  if (!selectedPlanId) { showToast('Please select a plan first', 'error'); return; }

  const btn = document.getElementById('pay-btn');
  btn.disabled = true; btn.textContent = '⏳ Creating order…';

  try {
    const data = await api('/api/payments/create-order', {
      method: 'POST',
      body: JSON.stringify({ plan_id: selectedPlanId, recharge_type: rechargeType })
    });

    if (!data.success) { showToast(data.error || 'Failed to create order', 'error'); return; }

    const order = data.data;

    if (order.payment_gateway === 'razorpay') {
      openRazorpay(order);
    } else {
      showToast('Gateway ' + order.payment_gateway + ' not supported on web yet', 'error');
    }
  } catch (e) {
    showToast('Network error. Please try again.', 'error');
  } finally {
    btn.disabled = false; btn.textContent = `💳 Pay ₹${document.getElementById('pay-amount').textContent}`;
  }
}

function openRazorpay(order) {
  const amountPaise = Math.round(parseFloat(order.amount) * 100);

  const options = {
    key:          order.key,
    amount:       amountPaise,
    currency:     'INR',
    name:         'NetFlow',
    description:  order.productinfo,
    prefill: {
      name:    order.firstname,
      email:   order.email || 'customer@netflow.in',
      contact: order.phone,
    },
    theme: { color: '#3b82f6' },
    modal: {
      ondismiss: () => showToast('Payment cancelled', 'info')
    },
    handler: async (response) => {
      // Payment successful — confirm with backend
      showToast('Verifying payment…', 'info');
      await confirmPayment(order.txnid, response.razorpay_payment_id);
    }
  };

  const rzp = new Razorpay(options);
  rzp.on('payment.failed', (resp) => {
    showToast('Payment failed: ' + (resp.error?.description || 'Unknown error'), 'error');
  });
  rzp.open();
}

async function confirmPayment(txnid, razorpayId) {
  try {
    const data = await api('/api/payments/upi-confirm', {
      method: 'POST',
      body: JSON.stringify({ txnid, status: 'success', razorpay_id: razorpayId })
    });

    if (data.success) {
      showToast('🎉 Recharge successful! Expiry: ' + (data.data?.new_expiry || ''), 'success');
      selectedPlanId = null;
      document.getElementById('pay-btn').style.display = 'none';
      document.querySelectorAll('.plan-card').forEach(c => c.classList.remove('selected'));
      // Refresh dashboard
      await loadDashboard();
      switchTab('home');
    } else {
      showToast('Payment done but activation pending. Contact support.', 'info');
    }
  } catch (e) {
    showToast('Payment done but could not confirm. Contact support.', 'info');
  }
}

// ══════════════════════════════════════
//  HISTORY
// ══════════════════════════════════════
async function loadHistory() {
  const listEl = document.getElementById('history-list');
  document.getElementById('history-loading').style.display = 'flex';
  listEl.innerHTML = '';

  try {
    const data = await api('/api/customer/recharge-history');
    document.getElementById('history-loading').style.display = 'none';

    const items = data.data?.data || [];
    if (!items.length) {
      listEl.innerHTML = '<div class="empty-state"><div class="empty-icon">📋</div><div class="empty-text">No recharge history yet</div></div>';
      return;
    }

    listEl.innerHTML = items.map(item => `
      <div class="history-item">
        <div>
          <div class="history-plan">${esc(item.plan_name || 'Unknown Plan')}</div>
          <div class="history-meta">
            ${item.recharge_type === 'advance' ? '⏩ Advance' : '🔄 Renewal'} •
            Expiry: ${item.new_expiry ? fmtDate(item.new_expiry) : 'N/A'}
          </div>
          ${item.txn_id ? `<div class="history-txn">TXN: ${esc(item.txn_id)}</div>` : ''}
          ${item.razorpay_id ? `<div class="history-txn">RZP: ${esc(item.razorpay_id)}</div>` : ''}
        </div>
        <div>
          <div class="history-amount">₹${item.amount || 0}</div>
          <div class="history-date">${fmtDateTime(item.created_at)}</div>
        </div>
      </div>
    `).join('');
  } catch (e) {
    document.getElementById('history-loading').style.display = 'none';
    listEl.innerHTML = '<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-text">Failed to load history</div></div>';
  }
}

// ══════════════════════════════════════
//  NOTIFICATIONS
// ══════════════════════════════════════
async function loadNotifications() {
  const listEl = document.getElementById('notif-list');
  document.getElementById('notif-loading').style.display = 'flex';
  listEl.innerHTML = '';

  try {
    const data = await api('/api/customer/notifications');
    document.getElementById('notif-loading').style.display = 'none';

    const notifs = data.data?.notifications || [];
    if (!notifs.length) {
      listEl.innerHTML = '<div class="empty-state"><div class="empty-icon">🔕</div><div class="empty-text">No notifications</div></div>';
      return;
    }

    listEl.innerHTML = notifs.map(n => `
      <div class="notif-item ${n.status === 'sent' ? 'unread' : ''}">
        <div class="notif-msg">${n.status === 'sent' ? '<span class="notif-dot"></span>' : ''}${esc(n.message)}</div>
        <div class="notif-time">${fmtDateTime(n.sent_at)}</div>
      </div>
    `).join('');

    // Mark as read
    if (data.data?.unread_count > 0) {
      api('/api/customer/notifications/read', { method: 'POST', body: '{}' });
      document.getElementById('notif-badge').style.display = 'none';
    }
  } catch (e) {
    document.getElementById('notif-loading').style.display = 'none';
    listEl.innerHTML = '<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-text">Failed to load notifications</div></div>';
  }
}

async function checkUnread() {
  try {
    const data = await api('/api/customer/notifications');
    const count = data.data?.unread_count || 0;
    const badge = document.getElementById('notif-badge');
    if (count > 0) { badge.style.display = 'flex'; badge.textContent = count; }
    else { badge.style.display = 'none'; }
  } catch {}
}

// ══════════════════════════════════════
//  WIFI CHANGE
// ══════════════════════════════════════
function renderWifi() {
  const el = document.getElementById('wifi-content');
  const ssid = profile?.wifi_ssid || 'Not set';
  const mac  = profile?.mac_address;

  el.innerHTML = `
    <div class="wifi-card">
      <div class="wifi-current">
        <div class="wifi-icon-big">📶</div>
        <div>
          <div class="wifi-current-label">Current WiFi Name</div>
          <div class="wifi-current-ssid">${esc(ssid)}</div>
        </div>
      </div>
      ${!mac ? `<div style="background:var(--yellow-dim);border:1px solid rgba(245,158,11,0.3);border-radius:10px;padding:12px;font-size:13px;color:var(--yellow);">⚠️ No device MAC address registered. WiFi change may not work. Contact your ISP.</div>` : ''}
    </div>

    <div class="wifi-card wifi-form">
      <div class="section-title" style="font-size:16px;margin-bottom:16px">🔧 Change WiFi</div>
      <div class="form-group">
        <label class="form-label">New WiFi Name (SSID)</label>
        <input type="text" id="new-ssid" class="form-input" placeholder="Enter new WiFi name">
        <div style="font-size:11px;color:var(--text3);margin-top:6px">Your full SSID will be prefixed by your ISP (e.g. "NetFlow YourName 4G")</div>
      </div>
      <div class="form-group">
        <label class="form-label">New WiFi Password</label>
        <input type="password" id="new-wifi-pass" class="form-input" placeholder="Min 8 characters">
      </div>
      <button class="btn-wifi" id="wifi-change-btn" onclick="submitWifiChange()">
        📡 Apply WiFi Change
      </button>
      <div class="error-msg" id="wifi-error" style="margin-top:12px"></div>
    </div>

    <div id="wifi-status-card" style="margin-top:12px"></div>
  `;

  loadWifiStatus();
}

async function loadWifiStatus() {
  try {
    const data = await api('/api/customer/wifi-status');
    if (!data.success || data.data?.status === 'none') return;
    const s = data.data;
    const statusColor = s.status === 'confirmed' ? 'var(--green)' : s.status === 'failed' ? 'var(--red)' : 'var(--yellow)';
    const statusIcon  = s.status === 'confirmed' ? '✅' : s.status === 'failed' ? '❌' : '⏳';
    document.getElementById('wifi-status-card').innerHTML = `
      <div style="background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px">
        <div style="font-size:13px;font-weight:600;color:${statusColor};margin-bottom:8px">${statusIcon} Last Change: ${s.status.toUpperCase()}</div>
        ${s.new_ssid ? `<div style="font-size:12px;color:var(--text2)">New SSID: ${esc(s.new_ssid)}</div>` : ''}
        ${s.failure_reason ? `<div style="font-size:12px;color:var(--red);margin-top:4px">Reason: ${esc(s.failure_reason)}</div>` : ''}
        ${s.created_at ? `<div style="font-size:11px;color:var(--text3);margin-top:4px">${fmtDateTime(s.created_at)}</div>` : ''}
      </div>
    `;
  } catch {}
}

async function submitWifiChange() {
  const newSsid = document.getElementById('new-ssid').value.trim();
  const newPass = document.getElementById('new-wifi-pass').value;
  const errEl   = document.getElementById('wifi-error');
  const btn     = document.getElementById('wifi-change-btn');

  errEl.style.display = 'none';

  if (!newSsid) { errEl.textContent = 'Please enter a new WiFi name.'; errEl.style.display = 'block'; return; }
  if (newPass.length < 8) { errEl.textContent = 'Password must be at least 8 characters.'; errEl.style.display = 'block'; return; }

  btn.disabled = true; btn.textContent = '⏳ Applying…';

  try {
    const data = await api('/api/customer/wifi-change', {
      method: 'POST',
      body: JSON.stringify({ new_ssid: newSsid, new_wifi_password: newPass })
    });

    if (data.success) {
      showToast('✅ WiFi change applied!', 'success');
      document.getElementById('new-ssid').value = '';
      document.getElementById('new-wifi-pass').value = '';
      // Refresh profile to update displayed SSID
      await loadDashboard();
      renderWifi();
    } else {
      errEl.textContent = data.error || 'WiFi change failed.';
      errEl.style.display = 'block';
    }
  } catch (e) {
    errEl.textContent = 'Network error. Please try again.';
    errEl.style.display = 'block';
  } finally {
    btn.disabled = false; btn.textContent = '📡 Apply WiFi Change';
  }
}

// ══════════════════════════════════════
//  HELPERS
// ══════════════════════════════════════
function esc(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtDate(d) {
  if (!d) return 'N/A';
  const [y, m, day] = d.split('-');
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${parseInt(day)} ${months[parseInt(m)-1]} ${y}`;
}

function fmtDateTime(dt) {
  if (!dt) return '';
  const d = new Date(dt.replace(' ', 'T'));
  if (isNaN(d)) return dt;
  return d.toLocaleString('en-IN', { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
}

let toastTimer;
function showToast(msg, type = 'info') {
  let existing = document.querySelector('.toast');
  if (existing) existing.remove();
  if (toastTimer) clearTimeout(toastTimer);

  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  document.body.appendChild(el);
  toastTimer = setTimeout(() => el.remove(), 4000);
}
</script>
